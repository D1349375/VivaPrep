<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2eb" />
    <meta name="description" content="VivaPrep 大學個人申請面試模擬與復盤" />
    <title>VivaPrep｜面試練習與復盤</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="importmap">
      { "imports": { "three": "/vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="app"><div class="app-boot-state" role="status">VivaPrep 正在準備面試練習室…</div></div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <script>
      window.addEventListener("error", (event) => {
        const root = document.getElementById("app");
        if (!root || root.querySelector(".app-shell, .interview-screen")) return;
        root.innerHTML = "";
        const message = document.createElement("p");
        message.className = "app-boot-state app-boot-error";
        message.textContent = "面試室啟動失敗：" + (event.message || "前端模組無法載入");
        root.appendChild(message);
      });
      window.addEventListener("unhandledrejection", (event) => {
        const root = document.getElementById("app");
        if (!root || root.querySelector(".app-shell, .interview-screen")) return;
        root.innerHTML = "";
        const message = document.createElement("p");
        message.className = "app-boot-state app-boot-error";
        message.textContent = "面試室模組載入失敗：" + (event.reason?.message || "請確認本機套件已安裝");
        root.appendChild(message);
      });
    </script>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
